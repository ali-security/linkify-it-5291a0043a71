name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha spec selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [ '18' ]

    steps:

    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Pin registry to the release-date time machine
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2023-12-01T21:47:27.805000Z

    - run: npm install

    - name: Test
      run: |
        npm run build
        npx c8 --exclude build --exclude test -r text -r html -r lcov mocha ${{ inputs.test-filter }}

    - name: Pack
      run: npm pack

    - name: Upload package tarball
      uses: actions/upload-artifact@v4
      with:
        name: npm-tarball
        path: '*.tgz'
        if-no-files-found: error
